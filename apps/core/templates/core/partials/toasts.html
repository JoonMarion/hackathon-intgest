{% if messages %}
    <div class="fixed right-4 top-4 z-50 space-y-2" role="status" aria-live="polite">
        {% for message in messages %}
            <div class="rounded border border-gray-300 bg-white px-4 py-3 text-sm shadow dark:border-gray-600 dark:bg-gray-800">
                {{ message }}
            </div>
        {% endfor %}
    </div>
{% endif %}
