{% load static %}
{% if messages %}
    <div class="fixed right-6 bottom-6 z-50 w-full max-w-sm space-y-2" role="status" aria-live="polite" aria-atomic="true" data-toast-region>
        {% for message in messages %}
            <div
                class="overflow-hidden rounded border bg-white text-sm shadow transition-opacity duration-200 dark:bg-gray-800 {% if 'error' in message.tags %}border-red-300 text-red-900 dark:border-red-700 dark:text-red-100{% elif 'success' in message.tags %}border-green-300 text-green-900 dark:border-green-700 dark:text-green-100{% else %}border-gray-300 text-gray-900 dark:border-gray-600 dark:text-gray-100{% endif %}"
                {% if 'error' in message.tags %}role="alert"{% else %}role="status"{% endif %}
                data-toast
                data-toast-duration="5000"
                tabindex="0"
            >
                <button type="button" data-e2e-selector="core-toasts-dismiss-click" class="block w-full cursor-pointer px-4 py-3 text-left" data-toast-close aria-label="Dismiss notification">
                    {{ message }}
                </button>
                <div
                    class="h-1 origin-left {% if 'error' in message.tags %}bg-red-500 dark:bg-red-400{% elif 'success' in message.tags %}bg-green-500 dark:bg-green-400{% else %}bg-gray-500 dark:bg-gray-400{% endif %}"
                    data-toast-progress
                ></div>
            </div>
        {% endfor %}
    </div>

    <script src="{% static 'core/js/toasts.js' %}"></script>
{% endif %}
