{% load static %}
{% if messages %}
    <div class="pf-toast-region fixed bottom-6 right-6 z-50 w-full space-y-3" role="status" aria-live="polite" aria-atomic="true" data-toast-region>
        {% for message in messages %}
            <div
                class="pf-toast text-sm {% if 'error' in message.tags %}pf-toast--error{% elif 'success' in message.tags %}pf-toast--success{% else %}pf-toast--info{% endif %}"
                {% if 'error' in message.tags %}role="alert"{% else %}role="status"{% endif %}
                data-toast
                data-toast-duration="5000"
                tabindex="0"
            >
                <button type="button" data-e2e-selector="core-toasts-dismiss-click" class="cursor-pointer px-4 py-3 text-left" data-toast-close aria-label="Dismiss notification">
                    <span class="block font-semibold">{{ message }}</span>
                    <span class="mt-1 block text-xs pf-text-muted">Clique para fechar.</span>
                </button>
                <div
                    class="h-1 {% if 'error' in message.tags %}pf-toast-progress--error{% elif 'success' in message.tags %}pf-toast-progress--success{% else %}pf-toast-progress--info{% endif %}"
                    data-toast-progress
                ></div>
            </div>
        {% endfor %}
    </div>

    <script src="{% static 'core/js/toasts.js' %}"></script>
{% endif %}
