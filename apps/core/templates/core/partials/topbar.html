{% load static %}
<header class="sticky top-0 z-10 flex items-center justify-between border-b border-gray-200 bg-white/95 px-6 py-6 backdrop-blur dark:border-gray-700 dark:bg-gray-900/90">
    <div class="text-sm font-medium text-gray-600 dark:text-gray-300">
        {% if user.is_authenticated %}
            {{ user.email|default:user.username }}
        {% else %}
            Visitante
        {% endif %}
    </div>

    <div class="flex items-center gap-2.5">
        <button type="button" data-theme-toggle data-e2e-selector="core-topbar-theme-toggle-click" class="inline-flex h-9 w-9 items-center justify-center rounded-full border border-gray-300 text-gray-700 transition-colors hover:bg-gray-100 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-emerald-500/60 dark:border-gray-600 dark:text-gray-200 dark:hover:bg-gray-800" aria-label="Alternar tema">
            <svg viewBox="0 0 24 24" class="h-4 w-4 dark:hidden" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="12" r="4"></circle>
                <path d="M12 2.5v2.2"></path>
                <path d="M12 19.3v2.2"></path>
                <path d="m4.9 4.9 1.6 1.6"></path>
                <path d="m17.5 17.5 1.6 1.6"></path>
                <path d="M2.5 12h2.2"></path>
                <path d="M19.3 12h2.2"></path>
                <path d="m4.9 19.1 1.6-1.6"></path>
                <path d="m17.5 6.5 1.6-1.6"></path>
            </svg>
            <svg viewBox="0 0 24 24" class="hidden h-4 w-4 dark:block" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M21 12.8A8.8 8.8 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path>
            </svg>
        </button>

        {% if user.is_authenticated %}
            {% with avatar_seed=user.username|default:user.email|default:"U" %}
                <div class="relative" data-user-menu>
                    <button
                        type="button"
                        data-user-menu-toggle
                        data-e2e-selector="core-topbar-user-menu-toggle-click"
                        class="inline-flex h-9 w-9 items-center justify-center rounded-full bg-emerald-600 text-sm font-semibold text-white transition-colors hover:bg-emerald-700 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-emerald-500/60 dark:bg-emerald-500/85 dark:text-emerald-950 dark:hover:bg-emerald-400"
                        aria-label="Abrir menu do usuário"
                        aria-haspopup="menu"
                        aria-expanded="false"
                    >
                        {{ avatar_seed|first|upper }}
                    </button>

                    <div
                        data-user-menu-panel
                        class="absolute right-0 mt-2 hidden min-w-44 rounded-xl border border-gray-200 bg-white p-1.5 shadow-sm dark:border-gray-700 dark:bg-gray-900"
                        role="menu"
                        aria-label="Menu do usuário"
                    >
                        <a
                            href="{% url 'accounts_http:profile' %}"
                            data-e2e-selector="core-topbar-profile-link-click"
                            class="block w-full rounded-lg px-3 py-2 text-left text-sm text-gray-700 transition-colors hover:bg-gray-100 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-emerald-500/60 dark:text-gray-200 dark:hover:bg-gray-800"
                            role="menuitem"
                        >
                            Minha conta
                        </a>
                        <form method="post" action="{% url 'accounts_http:logout' %}" class="mt-1">
                            {% csrf_token %}
                            <button
                                type="submit"
                                data-e2e-selector="core-topbar-logout-submit-click"
                                class="block w-full rounded-lg px-3 py-2 text-left text-sm text-red-600 transition-colors hover:bg-red-50 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-emerald-500/60 dark:text-red-400 dark:hover:bg-red-500/10"
                                role="menuitem"
                            >
                                Sair
                            </button>
                        </form>
                    </div>
                </div>
            {% endwith %}
        {% endif %}
    </div>
</header>

<script src="{% static 'core/js/user-menu.js' %}"></script>
